# Deploy a $0 demo on Render using New → Blueprint.
# IMPORTANT: free instances sleep and have EPHEMERAL storage. Saved alerts/push
# subscriptions are lost on restart; alerts will not be reliably instant.
services:
  - type: web
    name: livestat-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: POLL_SECONDS
        value: '12'
