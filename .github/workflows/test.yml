name: LiveStat Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check src/providers/espn.js
      - run: node --check public/intelligence-ui.js
      - run: node --check src/providers/intelligence.js
      - run: node --check src/engine/discord.js
      - run: node --check src/providers/analytics.js
      - run: node --check public/analytics-lab.js
      - run: node --check public/analytics-card.js
      - run: node --check public/formula.js
      - run: node --check public/roster-browser.js
      - run: node --check src/providers/roster-browser.js
      - run: npm test

